<!DOCTYPE html>
<html lang="my">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#dff3fa" />
    <meta name="description" content="မေမေနဲ့ ကလေးအတူ မြန်မာဗျည်းအက္ခရာ ၃၃ လုံး ရေးနည်း လေ့ကျင့်ရန်" />
    <title>လက်ကလေး — မြန်မာဗျည်းအက္ခရာ ရေးနည်း</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-shell" role="status">
            <div>
                <span class="loading-pencil" aria-hidden="true"></span>
                <strong>စာရေးခန်းလေး ပြင်ဆင်နေပါတယ်…</strong>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        တစ်ခုခု အဆင်မပြေဖြစ်သွားပါတယ်။
        <a href="." class="reload">ပြန်ဖွင့်မယ်</a>
        <span class="dismiss" aria-label="ပိတ်မည်">×</span>
    </div>
    <script src="js/app.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
